<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantic search — Ludek's People Analytics Second Brain</title>
<script>
  // match the theme chosen via the site's toggle (same localStorage key
  // and attribute as Quartz's darkmode plugin); falls back to OS scheme
  const saved = localStorage.getItem("theme");
  if (saved) document.documentElement.setAttribute("saved-theme", saved);
</script>
<style>
  :root, :root[saved-theme="light"] {
    --bg: #faf8f8; --fg: #2b2b2b; --muted: #4e4e4e; --border: #e5e5e5;
    --accent: #284b63; --card: #ffffff; --tag-bg: #ecf1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([saved-theme="light"]) {
      --bg: #161618; --fg: #ebebec; --muted: #d4d4d4; --border: #393639;
      --accent: #7b97aa; --card: #1e1e21; --tag-bg: #26303a;
    }
  }
  :root[saved-theme="dark"] {
    --bg: #161618; --fg: #ebebec; --muted: #d4d4d4; --border: #393639;
    --accent: #7b97aa; --card: #1e1e21; --tag-bg: #26303a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Source Sans Pro", -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); font-size: .95rem; margin-bottom: 1.5rem; }
  .sub a { color: var(--accent); }
  #q {
    width: 100%; padding: .75rem 1rem; font-size: 1.05rem; color: var(--fg);
    background: var(--card); border: 1px solid var(--border); border-radius: .5rem;
    outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #status { color: var(--muted); font-size: .9rem; margin: .75rem 0 .5rem; min-height: 1.2rem; }
  #bar-wrap {
    height: 6px; background: var(--border); border-radius: 3px;
    margin-bottom: 1.25rem; overflow: hidden; display: none;
  }
  #bar { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
  .hit {
    display: block; text-decoration: none; color: inherit; background: var(--card);
    border: 1px solid var(--border); border-radius: .5rem;
    padding: .9rem 1.1rem; margin-bottom: .75rem;
  }
  .hit:hover { border-color: var(--accent); }
  .hit h3 { margin: 0 0 .25rem; font-size: 1.05rem; color: var(--accent); }
  .hit p { margin: 0 0 .5rem; font-size: .9rem; color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
  .score {
    font-size: .75rem; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 1rem; padding: 0 .5rem;
  }
  .tag {
    font-size: .75rem; background: var(--tag-bg); color: var(--accent);
    border-radius: 1rem; padding: 0 .5rem;
  }
  .date { font-size: .75rem; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>
<main>
  <h1>🔎 Semantic search</h1>
  <p class="sub">Search my people-analytics notes by meaning, not keywords — try
  “why do people quit” or “measuring personality reliably”. Runs entirely in your
  browser. Long notes are indexed as passages across their cleaned prose.
  <a href="./">← Back to the brain</a></p>
  <input id="q" type="search" placeholder="Preparing search…" disabled autofocus>
  <div id="status">Checking for cached model…</div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div id="results"></div>
</main>
<script type="module">
  // Versions are pinned; keep the three URLs below in sync with
  // pipeline/package.json (@huggingface/transformers) if ever upgraded.
  const TRANSFORMERS_URL = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";
  const MODEL_URL = "https://huggingface.co/Xenova/all-MiniLM-L6-v2/resolve/main/onnx/model_quantized.onnx";
  const ORT_BASE = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.26.0-dev.20260416-b7804b056c/dist/";
  const WASM_URL = ORT_BASE + "ort-wasm-simd-threaded.asyncify.wasm";
  const FALLBACK_SIZES = { [MODEL_URL]: 23.0e6, [WASM_URL]: 23.6e6 };

  const status = document.getElementById("status");
  const input = document.getElementById("q");
  const resultsEl = document.getElementById("results");
  const barWrap = document.getElementById("bar-wrap");
  const bar = document.getElementById("bar");

  // Download with streaming progress; served from the shared cache when present.
  const progress = {};
  function report() {
    const done = Object.values(progress).reduce((a, p) => a + p.done, 0);
    const total = Object.values(progress).reduce((a, p) => a + p.total, 0);
    if (!total) return;
    bar.style.width = `${Math.min(100, (done / total) * 100)}%`;
    status.textContent = `Downloading search model — ${(done / 1e6).toFixed(1)} / ${(total / 1e6).toFixed(0)} MB (first visit only)…`;
  }
  async function fetchWithProgress(url, cache) {
    if (cache) {
      const hit = await cache.match(url);
      if (hit) return hit.blob();
    }
    barWrap.style.display = "block";
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url.split("/").pop()}`);
    const total = +resp.headers.get("Content-Length") || FALLBACK_SIZES[url] || 0;
    progress[url] = { done: 0, total };
    const reader = resp.body.getReader();
    const chunks = [];
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      progress[url].done += value.length;
      report();
    }
    progress[url].done = progress[url].total = total || progress[url].done;
    report();
    const blob = new Blob(chunks);
    if (cache) await cache.put(url, new Response(blob)).catch(() => {});
    return blob;
  }

  try {
    let cache = null;
    try { cache = await caches.open("transformers-cache"); } catch {} // e.g. private browsing

    // The three big downloads run in parallel: library, model, wasm runtime.
    const [{ pipeline, env }, indexP, modelBlob, wasmBlob] = await Promise.all([
      import(TRANSFORMERS_URL),
      fetch("./semantic_index.json").then(r => r.json()),
      fetchWithProgress(MODEL_URL, null).then(async b => {
        // store under the exact key transformers.js looks up
        if (cache && !(await cache.match(MODEL_URL)))
          await cache.put(MODEL_URL, new Response(b)).catch(() => {});
        return b;
      }),
      fetchWithProgress(WASM_URL, cache),
    ]);
    const index = await indexP;

    // Hand the prefetched runtime straight to ONNX — no second download.
    env.backends.onnx.wasm.wasmPaths = {
      wasm: URL.createObjectURL(wasmBlob),
      mjs: ORT_BASE + "ort-wasm-simd-threaded.asyncify.mjs",
    };
    status.textContent = "Initializing model…";
    const extractor = await pipeline("feature-extraction", index.model);

    barWrap.style.display = "none";
    input.disabled = false;
    input.placeholder = "Search by meaning…";
    const passageCount = index.passageCount ?? index.vectorCount ?? index.posts.reduce((n, p) => n + p.vecs.length, 0);
    status.textContent = `Ready — ${index.posts.length} notes indexed across ${passageCount} body passages.`;
    input.focus();

    let timer;
    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(search, 350);
    });

    async function search() {
      const q = input.value.trim();
      if (q.length < 3) { resultsEl.innerHTML = ""; return; }
      status.textContent = "Searching…";
      const out = await extractor(q, { pooling: "mean", normalize: true });
      const qv = out.data;
      const scored = index.posts.map(p => {
        let best = -1;
        for (const v of p.vecs) {
          let dot = 0;
          for (let i = 0; i < v.length; i++) dot += v[i] * qv[i];
          if (dot > best) best = dot;
        }
        return { p, s: best };
      }).sort((a, b) => b.s - a.s).slice(0, 15);
      status.textContent = `Top matches for “${q}”:`;
      resultsEl.innerHTML = scored.map(({ p, s }) => `
        <a class="hit" href="./posts/${p.slug}">
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.description)}</p>
          <div class="meta">
            <span class="score">${(s * 100).toFixed(0)}% match</span>
            ${p.tags.slice(0, 4).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
            <span class="date">${esc(p.date)}</span>
          </div>
        </a>`).join("");
    }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // support ?q= handoff (e.g. from the site's Ctrl+K search)
    const preset = new URLSearchParams(location.search).get("q");
    if (preset) { input.value = preset; search(); }
  } catch (e) {
    status.textContent = "Could not load semantic search: " + e.message;
  }
</script>
</body>
</html>
