name: Deploy second brain to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Quartz dependencies
        working-directory: site
        run: npm ci
      - name: Build site
        working-directory: site
        run: npx quartz build -d ../vault
      - name: Add llms.txt and semantic search
        run: |
          cp pipeline/cache/llms.txt site/public/llms.txt
          cp pipeline/cache/llms-full.txt site/public/llms-full.txt
          cp pipeline/cache/semantic_index.json site/public/semantic_index.json
          cp pipeline/static/semantic-search.html site/public/semantic-search.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
