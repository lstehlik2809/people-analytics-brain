name: Deploy second brain to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Quartz dependencies
        working-directory: site
        run: npm ci
      - name: Sync vault into site content
        run: |
          mkdir -p site/content
          cp -r vault/. site/content/
      - name: Build site
        working-directory: site
        run: npx quartz build
      - name: Add llms.txt files
        run: |
          cp pipeline/cache/llms.txt site/public/llms.txt
          cp pipeline/cache/llms-full.txt site/public/llms-full.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
